# `app` is a placeholder (`call-agent`). If Builder already created the
# Fly app, keep that name. Do not fly launch a second app. No secrets here.

app = "call-agent"
primary_region = "iad"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
