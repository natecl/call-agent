name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stub-verify:
    runs-on: ubuntu-latest
    env:
      QUICK_ASK_LIVE: "0"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: call-agent verify-quick-ask --to +15555550123 --ask hours --name Nathan --mode stub
      - run: call-agent verify-message
      - run: call-agent verify-persistence
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/webhooks/package-lock.json
      - run: npm ci
        working-directory: workers/webhooks
      - run: npm test
        working-directory: workers/webhooks
      - run: npm run verify
        working-directory: workers/webhooks
      - run: call-agent verify-webhooks
