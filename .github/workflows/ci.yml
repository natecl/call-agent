name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stub-verify:
    runs-on: ubuntu-latest
    env:
      QUICK_ASK_LIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: call-agent verify-quick-ask --to +15555550123 --ask hours --name Nathan --mode stub
